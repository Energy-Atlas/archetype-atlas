{% extends "base.html" %}

{#-
  Preload the two fonts every page uses (assets/fonts.css), so that the first frame is drawn without a font swap
  (design/ui-design-spec.md, sections 0.4 and 0.12). Record pages keep these links in their compact shell.
-#}
{% block extrahead %}
  <link rel="preload" href="{{ 'assets/fonts/geist-latin.woff2' | url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ 'assets/fonts/geist-mono-latin.woff2' | url }}" as="font" type="font/woff2" crossorigin>
{% endblock %}
