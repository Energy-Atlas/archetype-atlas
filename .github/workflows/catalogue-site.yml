name: Catalogue site

on:
  push:
    paths:
      - 'website/**'
      - 'scripts/site*.py'
      - 'tests/site*.js'
      - 'tests/test_site*.py'
      - 'data/releases/**'
      - 'data/resolution-releases/**'
      - 'scripts/resolve.py'
      - 'requirements*.txt'
      - 'mkdocs.yml'
      - '.github/workflows/catalogue-site.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/releases/**'
      - 'data/resolution-releases/**'
      - 'requirements*.txt'
      - 'mkdocs.yml'
      - '.github/workflows/catalogue-site.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified artifact to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned build and browser dependencies
        run: |
          python -m pip install -r requirements-site.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify frozen releases and presentation contracts
        run: |
          python -m scripts.release --verify --target data/releases/v0.1.0
          python -m scripts.release --verify --target data/releases/v0.2.0
          python -m scripts.resolve --verify
          python -m unittest tests.test_site tests.test_site_delivery -q
          node --test tests/site_core.test.js tests/site_parity.test.js
      - name: Generate both versioned catalogues and build
        run: |
          python -m scripts.site
          python -m mkdocs build --strict
      - name: Verify all links and browser behavior
        run: |
          python -m scripts.site_check
          python -m scripts.site_smoke --screenshots build/screenshots
      - name: Retain verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogue-verification
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch
      || github.ref_name == 'feat/catalogue-site' || github.ref_name == 'feat/schedule-resolution'))
      || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: catalogue-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
