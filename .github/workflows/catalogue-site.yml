name: Catalogue site

on:
  push:
    paths:
      - 'website/**'
      - 'scripts/active*.py'
      - 'scripts/object_site.py'
      - 'scripts/program_json.py'
      - 'scripts/schedule_json.py'
      - 'tests/test_active_site.py'
      - 'tests/test_object_browser.py'
      - 'tests/test_program_json*.py'
      - 'tests/schedule_core.test.js'
      - 'schemas/*-json-v2.schema.json'
      - 'sources/program-json-defaults.json'
      - 'docs/program-json-v2-contract.md'
      - 'scripts/definition*.py'
      - 'scripts/program_definitions.py'
      - 'scripts/program_composition.py'
      - 'scripts/construction_definitions.py'
      - 'scripts/hvac_definitions.py'
      - 'scripts/residential_definitions.py'
      - 'tests/test_definition*.py'
      - 'sources/definition*.json'
      - 'sources/program-composition-policy.json'
      - 'data/definition-releases/**'
      - 'schemas/definitions.schema.json'
      - 'docs/definition-contract.md'
      - 'scripts/site*.py'
      - 'scripts/query*.py'
      - 'tests/test_query*.py'
      - 'schemas/query-*.schema.json'
      - 'tests/site*.js'
      - 'tests/test_site*.py'
      - 'tests/test_water_reporting*.py'
      - 'schemas/water-reporting.schema.json'
      - 'data/releases/**'
      - 'data/resolution-releases/**'
      - 'data/water-releases/**'
      - 'data/completion-releases/**'
      - 'data/water-reporting-releases/**'
      - 'scripts/water_reporting.py'
      - 'scripts/catalogue_names.py'
      - 'scripts/commercial*.py'
      - 'sources/completion-evidence-lock.json'
      - 'scripts/water_equivalent.py'
      - 'scripts/schedule_coverage.py'
      - 'sources/water-evidence-lock.json'
      - 'sources/schedule-release-scope.json'
      - 'scripts/resolve.py'
      - 'requirements*.txt'
      - 'mkdocs.yml'
      - '.github/workflows/catalogue-site.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'data/definition-releases/**'
      - 'schemas/definitions.schema.json'
      - 'schemas/query-v2.schema.json'
      - 'schemas/*-json-v2.schema.json'
      - 'sources/program-json-defaults.json'
      - 'docs/program-json-v2-contract.md'
      - 'sources/definition*.json'
      - 'sources/program-composition-policy.json'
      - 'docs/definition-contract.md'
      - 'scripts/**'
      - 'tests/**'
      - 'data/releases/**'
      - 'data/resolution-releases/**'
      - 'data/water-releases/**'
      - 'data/completion-releases/**'
      - 'requirements*.txt'
      - 'data/water-reporting-releases/**'
      - 'mkdocs.yml'
      - '.github/workflows/catalogue-site.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified artifact to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned build and browser dependencies
        run: |
          python -m pip install -r requirements-site.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Decide whether the frozen releases need verification
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Release verification is skipped only when every changed path is presentation-only
          # (docs/site-build.md, "Release gate"). Anything else, an unknown base, or a manual
          # dispatch verifies the frozen releases. validate.yml verifies them on every push regardless.
          presentation='^(website/|design/|docs/|mkdocs\.yml$|(README|CHANGELOG|AGENTS|CLAUDE)\.md$|scripts/(active_site|active_smoke|object_site|definition_site|site_check|site_smoke|site_assets)\.py$|tests/(test_active_site|test_object_browser|test_html_delivery|test_site_delivery|test_search_index|test_definition_site)\.py$|tests/[^/]+\.test\.js$)'
          base=""
          case "$EVENT" in
            push) base="$BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
          esac
          if [ "$EVENT" = push ] && { [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; }; then
            # A new branch: compare with the default branch's tip.
            git fetch --no-tags --depth=1 origin "$DEFAULT_BRANCH" && base=$(git rev-parse FETCH_HEAD) || base=""
          elif [ -n "$base" ]; then
            git fetch --no-tags --depth=1 origin "$base" || base=""
          fi
          if [ -z "$base" ] || ! changed=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            echo "No comparable base ($EVENT); verifying the frozen releases."
            echo "releases=true" >> "$GITHUB_OUTPUT"
          elif relevant=$(grep -Ev "$presentation" <<< "$changed" | grep .); then
            echo "Release-relevant paths changed:"
            head -50 <<< "$relevant"
            echo "releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only presentation paths changed since $base; the frozen release checks are skipped."
            echo "releases=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify frozen releases
        if: steps.scope.outputs.releases == 'true'
        run: |
          python -m scripts.fetch
          python -m scripts.fetch --lock sources/schedule-evidence-lock.json
          python -m scripts.fetch --lock sources/water-evidence-lock.json
          python -m scripts.fetch --lock sources/completion-evidence-lock.json
          python -m scripts.fetch --lock sources/definition-evidence-lock.json
          python -m scripts.definition_release --verify
          python -m scripts.definition_release --reproduce
          python -m unittest tests.test_definition_full tests.test_query_v2 tests.test_query_v2_history -q
          python -m scripts.release --verify --target data/releases/v0.1.0
          python -m scripts.release --verify --target data/releases/v0.2.0
          python -m scripts.resolve --verify
          python -m scripts.resolve --verify --target data/resolution-releases/v0.1.0
          python -m scripts.resolve --verify --target data/resolution-releases/v0.2.0
          python -m scripts.resolve --verify --target data/resolution-releases/v0.3.0
          python -m scripts.commercial_completion --verify
          python -m scripts.water_equivalent --verify
          python -m scripts.water_reporting --verify
          python -m unittest tests.test_water_reporting_site tests.test_site -q
      - name: Verify presentation contracts
        run: |
          python -m scripts.definition_release --verify
          python -m unittest tests.test_definition_site -q
          python -m unittest tests.test_site_delivery tests.test_html_delivery -q
          python -m unittest tests.test_query_delivery tests.test_query_client tests.test_query_compression tests.test_query_history tests.test_query_site -q
          python -m unittest tests.test_program_json_contract tests.test_program_json_export tests.test_active_site tests.test_object_browser -q
          node --test tests/*.test.js
      - name: Generate the current definition catalogue and build
        run: |
          python -m scripts.site
          python -m mkdocs build --strict
      - name: Verify all links and browser behavior
        run: |
          python -m scripts.site_check
          python -m scripts.site_smoke --screenshots build/screenshots
      - name: Retain verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogue-verification
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: build
    if: >-
      (github.event_name == 'push' && (github.ref_name == github.event.repository.default_branch
      || github.ref_name == 'feat/catalogue-site' || github.ref_name == 'feat/schedule-resolution'))
      || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: catalogue-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
