name: Catalogue site

# One pipeline per pull request or main push; working branches can be checked manually.
# Do not path-filter required checks: even a docs-only PR must report its gates.
# A push to main skips the unit shards its pull request already passed (validate.yml) and
# runs the full catalogue smoke the pull request sampled; the weekly run and manual runs
# run everything.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish to GitHub Pages (main only, after all validation)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A validation-only manual run must not displace a queued main publisher.
  group: catalogue-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && !inputs.deploy && 'validation' || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  research:
    uses: ./.github/workflows/validate.yml
    with:
      full: ${{ github.event_name != 'push' }}
      full_catalogue: ${{ github.event_name != 'pull_request' }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned build and browser dependencies
        run: |
          python -m pip install -r requirements-site.txt -r requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify presentation contracts
        run: |
          python -m unittest tests.test_suite_site tests.test_search_index tests.test_html_delivery tests.test_card_icons tests.test_site_asset_versions tests.test_ci_workflows -q
          python -m unittest tests.test_program_json_contract tests.test_program_json_aggregation tests.test_program_v3_schema tests.test_program_recovery -q
          node --test tests/*.test.js
      # Site output is a pure function of the release and the scripts (ADR 0036 section 1, ADR 0043):
      # the generated pages and the MkDocs build are cached under a digest of their inputs, and
      # site_check and site_smoke still run on every tree, cached or not.
      - name: Digest the site inputs
        id: digest
        run: echo "value=$(python -m scripts.suite_site --digest)" >> "$GITHUB_OUTPUT"
      - name: Restore the generated and built catalogue
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/site-docs
            build/site
          key: suite-site-built-${{ steps.digest.outputs.value }}
      - name: Generate the suite catalogue of the newest release
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m scripts.suite_site
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m mkdocs build --strict
      - name: Verify all links and browser behavior
        run: |
          python -m scripts.site_check --require-complete
          python -m scripts.site_smoke --screenshots build/screenshots
      - name: Retain verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalogue-verification
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: build/site

  deploy:
    needs: [research, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: catalogue-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
