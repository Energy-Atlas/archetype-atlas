name: Validate archetype atlas
on:
  workflow_call:
    inputs:
      full:
        description: Run the unit, Windows and schedule jobs too (false only for a push to protected main)
        type: boolean
        default: true
      full_catalogue:
        description: Generate every packaged programme in the schedules job (false samples two per family, for pull requests)
        type: boolean
        default: true
permissions:
  contents: read
# Research checks run as parallel jobs behind the two required checks: "atlas
# (ubuntu-latest, 3.11)" passes only when every Linux job passes, and "atlas
# (windows-latest, 3.14)" only when every Windows job passes. Release 2.0.0 is the
# only release in the tree (ADR 0046 section 7): it is verified by its file
# checksums; the frozen releases and their reproductions live at the tag
# frozen-data-2026-10-27.
# The unit suite runs as three shards per platform (scripts/ci_tests.py). A push to main
# runs the release and package jobs and the full catalogue smoke: main takes only pull
# requests tested up to date with it (strict branch protection), so the unit shards are
# not run again; the weekly run in catalogue-site.yml runs everything. A pull request
# runs every job but samples the catalogue smoke (two recipes per family).
jobs:
  unit-tests:
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        shard: [atlas, schedules-commercial, schedules-rest]
    name: unit-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # The full suite includes the configured Markdown renderer and site refresh.
      - run: python -m pip install -r requirements-site.txt
      - name: Fetch pinned sources the suite reads
        run: |
          python -m scripts.fetch
          python -m scripts.fetch --lock sources/schedule-evidence-lock.json
      - run: python -m scripts.ci_tests --shard ${{ matrix.shard }}

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-site.txt
      - name: Fetch pinned sources
        run: |
          python -m scripts.fetch
          python -m scripts.fetch --lock sources/daylighting-rules-lock.json
      - name: Verify release 2.0.0, its export schemas and the source pipeline
        run: |
          python -m scripts.atlas_snapshot --verify
          python -m scripts.release_editor --check
          python -m scripts.atlas_exports --check-schemas
          python -m scripts.reconciliation_page --check
          python -m scripts.daylighting_rules_review --check
          python -m scripts.validate
          python -m scripts.reproduce
          python -m scripts.compare --report build/source-comparison.json
          python -m scripts.coverage --report build/coverage.json
      - run: python -m scripts.audit

  schedules:
    if: inputs.full || inputs.full_catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Generate the packaged catalogue (every recipe, or two per family on a pull request)
        env:
          FULL_CATALOGUE: ${{ inputs.full_catalogue }}
        run: |
          if [ "$FULL_CATALOGUE" = true ]; then python -m scripts.smoke_catalogue; else python -m scripts.smoke_catalogue --sample 2; fi

  package:
    # The atlas-schedules wheel (ADR 0049): built, installed in a clean environment and run from outside the checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m build --wheel
      - name: Install the wheel in a clean environment and generate the quick-start example
        run: |
          python -m venv /tmp/atlas-schedules-venv
          /tmp/atlas-schedules-venv/bin/python -m pip install dist/*.whl
          mkdir /tmp/quick-start
          cp docs/examples/schedule-generator/office-and-retail.json /tmp/quick-start/
          cd /tmp/quick-start
          /tmp/atlas-schedules-venv/bin/atlas-schedules office-and-retail.json -o bundle.json
          /tmp/atlas-schedules-venv/bin/python -m atlas_schedules office-and-retail.json -o bundle-m.json
          cmp bundle.json bundle-m.json
          /tmp/atlas-schedules-venv/bin/python -c "import json, atlas_schedules, importlib.metadata as m; b = json.load(open('bundle.json')); assert b['generator_version'] == atlas_schedules.__version__ == m.version('atlas-schedules'); print(b['generator_version'], len(b['schedules']), 'schedules')"

  atlas-linux:
    name: atlas (ubuntu-latest, 3.11)
    needs: [unit-tests, release, schedules, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Linux research job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          FULL: ${{ inputs.full }}
        run: |
          echo "Linux research jobs: $RESULTS (full: $FULL)"
          for result in $RESULTS; do [ "$result" = success ] || { [ "$FULL" = false ] && [ "$result" = skipped ]; } || exit 1; done

  windows-tests:
    if: inputs.full
    strategy:
      fail-fast: false
      matrix:
        shard: [atlas, schedules-commercial, schedules-rest]
    name: windows-tests (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-site.txt
      - name: Fetch pinned sources the suite reads
        run: |
          python -m scripts.fetch
          python -m scripts.fetch --lock sources/schedule-evidence-lock.json
      - name: Verify release 2.0.0 on this platform
        if: matrix.shard == 'atlas'
        run: python -m scripts.atlas_snapshot --verify
      - run: python -m scripts.ci_tests --shard ${{ matrix.shard }}

  atlas-windows:
    name: atlas (windows-latest, 3.14)
    needs: [windows-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Windows job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          FULL: ${{ inputs.full }}
        run: |
          echo "Windows jobs: $RESULTS (full: $FULL)"
          for result in $RESULTS; do [ "$result" = success ] || { [ "$FULL" = false ] && [ "$result" = skipped ]; } || exit 1; done
