name: Validate archetype atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  atlas:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.fetch
      - run: python -m unittest discover -s tests -v
      - run: python -m scripts.validate
      - run: python -m scripts.reproduce
      - run: python -m scripts.compare --report build/source-comparison.json
      - run: python -m scripts.coverage --report build/coverage.json
      - run: python -m scripts.release --verify
      - run: python -m scripts.release --verify --target data/releases/v0.1.0
      - run: python -m scripts.resolve --verify
      - run: python -m scripts.resolve --verify --target data/resolution-releases/v0.1.0
      - run: python -m scripts.fetch --lock sources/schedule-evidence-lock.json
      - run: python -m scripts.audit
