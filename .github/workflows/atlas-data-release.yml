name: atlas data release

# A tag vX.Y.Z attaches the data archive atlas-release-X.Y.Z.zip (the release folder and its base folders
# as they sit in data/atlas-releases) and its SHA256SUMS.txt to the GitHub release of that tag (ADR 0051
# section 6). The tag must name the newest release in the tree (scripts.atlas_delta.RELEASE); the archive
# is reproducible (sorted entries, fixed times; scripts/build_release_assets.py).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Require the tag to name the newest release in the tree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          release="$(python -c 'from scripts import atlas_delta; print(atlas_delta.RELEASE)')"
          [ "$TAG" = "v$release" ] || { echo "tag $TAG does not name release $release"; exit 1; }
      - name: Verify the release chain and build the archive with SHA256SUMS.txt
        run: |
          python -m scripts.atlas_snapshot --verify
          python -m scripts.atlas_delta --verify --release 2.1.0
          python -m scripts.atlas_delta --verify
          python -m scripts.build_release_assets --data
          (cd build/release/v* && sha256sum -c SHA256SUMS.txt)
      - name: Attach the archive and SHA256SUMS.txt to the release of this tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets="$(ls build/release/v*/*.zip build/release/v*/SHA256SUMS.txt)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" $assets --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $assets --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "Atlas release ${TAG#v}" --notes "Atlas data release ${TAG#v}: the release folder with its bases; verify with sha256sum -c SHA256SUMS.txt (ADR 0051; docs/release-notes-atlas-${TAG}.md)."
          fi
