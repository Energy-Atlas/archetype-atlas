[build-system]
requires = ["flit_core==3.12.0"]
build-backend = "flit_core.buildapi"

[project]
name = "atlas-schedules"
dynamic = ["version", "description"]
readme = "atlas_schedules/README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-4.0"
license-files = ["LICENSE", "atlas_schedules/data/notices/*.json"]
authors = [{ name = "The Archetype Atlas authors" }]
dependencies = ["numpy>=2", "jsonschema>=4.20"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/Energy-Atlas/archetype-atlas"

[project.scripts]
atlas-schedules = "atlas_schedules.__main__:main"

[tool.flit.module]
name = "atlas_schedules"

[tool.flit.sdist]
include = ["LICENSE"]
exclude = ["**/__pycache__"]
