site_name: Energy Archetype Atlas
site_description: Versioned, source-traceable building energy inputs for zoning-LOD research.
site_url: https://energy-atlas.github.io/archetype-atlas/
repo_url: https://github.com/Energy-Atlas/archetype-atlas
repo_name: Energy-Atlas/archetype-atlas
edit_uri: ""
docs_dir: build/site-docs
site_dir: build/site
use_directory_urls: true
strict: true
theme:
  name: material
  font: false
  palette:
    scheme: default
    primary: teal
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.code.copy
plugins:
  - search
hooks:
  - website/hooks/search_index.py
  - website/hooks/html_delivery.py
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - assets/site.css
extra_javascript:
  - assets/core.js
  - assets/site.js
  - assets/definition_core.js
  - assets/definition.js
nav:
  - Home: index.md
  - Catalogue: catalogue.md
  - How to use:
      - Selection workflow: guides/selection.md
      - Medium Office example: guides/medium-office.md
      - Residential and multifamily: guides/residential.md
      - Geometry assignment: guides/geometry.md
      - Hot-water equivalents: guides/hot-water.md
      - Commercial fixture catalogue: commercial-completion/index.md
      - Complete water reporting: water-reporting/index.md
      - Catalogue names: guides/catalogue-names.md
      - Coverage and remaining gaps: guides/coverage.md
  - Methods: methods.md
  - Resolution supplement: resolution-supplements/index.md
  - Schedule mechanisms: guides/schedule-methods.md
  - Data delivery:
      - Element definitions v2: guides/definitions.md
      - Start here: guides/data-delivery.md
      - Query contract: guides/data-delivery-contract.md
      - Schedules and conformance: guides/data-delivery-schedules.md
  - Sources: sources.md
  - Downloads: downloads.md
validation:
  nav:
    omitted_files: ignore
copyright: Original work unlicensed. Upstream data and dependency terms apply.
