site_name: Energy Archetype Atlas
site_description: Versioned, source-traceable building energy inputs for zoning-LOD research.
site_url: https://energy-atlas.github.io/archetype-atlas/
repo_url: https://github.com/Energy-Atlas/archetype-atlas
repo_name: Energy-Atlas/archetype-atlas
edit_uri: ""
docs_dir: build/site-docs
site_dir: build/site
use_directory_urls: true
strict: true
theme:
  name: material
  # Templates: preloads the self-hosted fonts (design/ui-design-spec.md, section 0.4).
  custom_dir: website/overrides
  # No font host: assets/fonts.css serves the vendored fonts from the site.
  font: false
  # The system preference picks the first scheme; the toggle switches (spec section 0.3).
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  # navigation.instant stays off: record pages use a compact shell and catalogue
  # scripts initialise on page load (spec section 0.12).
  features:
    - navigation.tabs
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.footer
    - content.code.copy
plugins:
  - search
hooks:
  - website/hooks/search_index.py
  - website/hooks/html_delivery.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - assets/fonts.css
  - assets/site.css
extra_javascript:
  - assets/definition_core.js
  - assets/definition.js
  - assets/object.js
  - assets/schedule_core.js
  - assets/schedule.js
nav:
  - Home: index.md
  - Catalogue: catalogue.md
  - How to use:
      - Selection workflow: guides/selection.md
      - Schedule inspection: guides/schedules.md
      - Program JSON contract: guides/program-json.md
      - Library definitions: guides/definitions.md
  - Sources: sources.md
validation:
  nav:
    omitted_files: ignore
copyright: Original work unlicensed. Upstream data and dependency terms apply.
